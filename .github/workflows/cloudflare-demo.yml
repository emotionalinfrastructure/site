name: Validate and deploy Cloudflare demo

on:
  pull_request:
    paths:
      - "app/trust-receipt/**"
      - "components/TrustReceiptDemo.tsx"
      - "lib/trust-receipt-*"
      - "worker/**"
      - "wrangler.jsonc"
      - "wrangler.local.jsonc"
      - "tools/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-demo.yml"
  push:
    branches:
      - main
    paths:
      - "app/trust-receipt/**"
      - "components/TrustReceiptDemo.tsx"
      - "lib/trust-receipt-*"
      - "worker/**"
      - "wrangler.jsonc"
      - "wrangler.local.jsonc"
      - "tools/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "public/_redirects"
      - ".github/workflows/cloudflare-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Worker dry run, and browser verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Trust Receipt integrity
        run: npm run test:trust-receipt

      - name: Build static export
        run: npm run build

      - name: Validate local Cloudflare Worker bundle
        run: |
          set -o pipefail
          npx --yes wrangler@4.114.0 deploy --dry-run --config wrangler.local.jsonc 2>&1 | tee wrangler-dry-run.log

      - name: Install browser test runtime
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Start the Worker locally
        run: |
          npx --yes wrangler@4.114.0 dev \
            --config wrangler.local.jsonc \
            --ip 127.0.0.1 \
            --port 8787 \
            --show-interactive-dev-session=false \
            > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid

          sleep 3
          if ! kill -0 "$(cat wrangler-dev.pid)" 2>/dev/null; then
            cat wrangler-dev.log
            exit 1
          fi

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat wrangler-dev.log
          exit 1

      - name: Run browser-level demo tests
        env:
          BASE_URL: http://127.0.0.1:8787/
        run: npx playwright test e2e/trust-receipt-deployment.spec.mjs --config=playwright.config.mjs

      - name: Show Worker log on failure
        if: failure()
        run: |
          cat wrangler-dry-run.log 2>/dev/null || true
          cat wrangler-dev.log 2>/dev/null || true

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-demo-diagnostics
          path: |
            wrangler-dry-run.log
            wrangler-dev.log
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local Worker
        if: always()
        run: |
          if [ -f wrangler-dev.pid ]; then
            kill "$(cat wrangler-dev.pid)" || true
          fi

  deploy-production:
    name: Deploy and verify branded production endpoint
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_URL: https://demo.emotionalinfrastructure.org/
      EXPECTED_HOST: demo.emotionalinfrastructure.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Verify Trust Receipt integrity
        run: npm run test:trust-receipt

      - name: Build static export
        run: npm run build

      - name: Deploy Worker and custom domain
        run: npx --yes wrangler@4.114.0 deploy --config wrangler.jsonc

      - name: Verify public endpoint three times
        run: node tools/postdeploy-smoke.mjs

      - name: Install browser test runtime
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Verify production in Chrome
        env:
          BASE_URL: https://demo.emotionalinfrastructure.org/
        run: npx playwright test e2e/trust-receipt-deployment.spec.mjs --config=playwright.config.mjs
