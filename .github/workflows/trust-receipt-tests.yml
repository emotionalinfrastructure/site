name: Trust Receipt Demo Tests

on:
  pull_request:
    paths:
      - "components/TrustReceiptDemo.tsx"
      - "lib/**"
      - "worker/**"
      - "tools/verify-demo-integrity.mjs"
      - "tests/**"
      - "vitest.config.mts"
      - "public/schemas/**"
      - "public/downloads/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trust-receipt-tests.yml"
  push:
    branches: [main]
    paths:
      - "components/TrustReceiptDemo.tsx"
      - "lib/**"
      - "worker/**"
      - "tools/verify-demo-integrity.mjs"
      - "tests/**"
      - "vitest.config.mts"
      - "public/schemas/**"
      - "public/downloads/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trust-receipt-tests.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify Trust Receipt demo integrity
        run: npm run test:trust-receipt

      - name: Build static site
        run: npm run build
